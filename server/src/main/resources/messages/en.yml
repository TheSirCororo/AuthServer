# MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Placeholders are listed next to the messages that use them.

prompt-register: "<gray>Register with <yellow>/register <password> <password>"
prompt-login: "<gray>Log in with <yellow>/login <password>"
title-register: "<gold>Welcome!"
subtitle-register: "<gray>/register <password> <password>"
title-login: "<gold>Welcome back!"
subtitle-login: "<gray>/login <password>"
title-success: "<green>Logged in"
subtitle-success: ""
# <seconds>
boss-bar-timer: "<gray>Time left: <yellow><seconds></yellow> s"

success-register: "<green>You are registered. Remember your password!"
success-login: "<green>You are logged in."
success-session: "<green>Welcome back! Your session was resumed."
success-premium: "<green>Licensed account verified."
routing: "<gray>Taking you to the server..."
authenticated-limbo: "<green>You are logged in. <gray>You can close the game now."

# <attempts>
wrong-password: "<red>Wrong password. <gray>Attempts left: <yellow><attempts>"
already-registered: "<red>This name is already registered. <gray>Use <yellow>/login <password>"
not-registered: "<red>This name is not registered. <gray>Use <yellow>/register <password> <password>"
password-mismatch: "<red>The passwords do not match."
# <min>
password-too-short: "<red>The password must be at least <min> characters long."
# <max>
password-too-long: "<red>The password must be at most <max> characters long."
password-unsafe: "<red>This password is too easy to guess. Choose another one."
password-same-as-name: "<red>The password must not be your name."
ip-limit: "<red>Too many accounts were registered from your address."
registration-denied: "<red>Registration was refused."

wrong-password-change: "<red>The current password is wrong."
change-password-success: "<green>Your password was changed."
unregister-success: "<green>Your account was deleted."
# <command>
premium-confirm: "<yellow>Only do this if you own a licensed Minecraft account!</yellow> <gray>From now on you will log in through Mojang. Confirm with <yellow>/<command> confirm"
premium-enabled: "<green>Licensed login enabled. Reconnect with your licensed account."
premium-already: "<gray>This account already uses licensed login."

# <usage>
usage: "<red>Usage: <yellow><usage>"
unknown-command: "<red>Unknown command."
login-first: "<red>Log in first."
chat-login-first: "<red>Log in before chatting."
players-only: "<red>Only players can use this command."

kick-timeout: "<red>You did not log in in time."
kick-too-many-attempts: "<red>Too many wrong passwords."
kick-invalid-name: "<red>This name is not allowed."
# <name>
kick-wrong-case: "<red>This name is registered as <yellow><name></yellow>. Log in with exactly that name."
kick-premium-account: "<red>This name belongs to a licensed account. <gray>Log in with a licensed client."
kick-licensed-disabled: "<red>Licensed login is disabled and this account has no password. <gray>Ask an administrator to set one."
kick-premium-required: "<red>This server requires a licensed Minecraft account."
kick-premium-mismatch: "<red>This name is bound to a different licensed account."
kick-already-connected: "<red>You are already connected."
# <versions>
kick-unsupported-version: "<red>Unsupported version. <gray>Use Minecraft <versions>."
kick-mojang-unavailable: "<red>Mojang's servers could not verify you. Try again later."
kick-unregistered: "<red>Your account was deleted."
kick-shutdown: "<gray>The server is restarting."
kick-internal-error: "<red>Something went wrong. Try again."
kick-proxy-only: "<red>Connect through the proxy."

help-item-name: "<gold>How to log in"
help-item-lore: "<gray>Right-click for instructions"
help-register: "<gray>This name is new. Register with <yellow>/register <password> <password></yellow> - type the same password twice."
help-login: "<gray>This name is registered. Log in with <yellow>/login <password></yellow>."
menu-title: "How do you want to log in?"
menu-offline-name: "<yellow>With a password"
menu-offline-lore: "<gray>Register now with /register"
menu-licensed-name: "<green>With a licensed account"
menu-licensed-lore: "<gray>Only if you bought Minecraft"
menu-confirm-name: "<green>Confirm: I own a licensed account"
menu-confirm-lore: "<gray>You will reconnect and log in through Mojang. If that fails, you can choose again."
kick-licensed-chosen: "<green>Licensed login chosen. <gray>Reconnect with your licensed Minecraft to log in automatically."
kick-licensed-failed: "<red>Mojang did not confirm a licensed account with this name. <gray>Reconnect to choose another way to log in."
licensed-login-failed: "<red>The licensed login did not work. <gray>Register with a password or try the licensed login again."
premium-choose-confirm: "<yellow>Only do this if you own a licensed Minecraft account!</yellow> <gray>You will reconnect and log in through Mojang. Confirm with <yellow>/<command> confirm"
# Two-factor authentication and email. Literal <...> without a placeholder of that name are shown as typed.
title-code-totp: "<gold>One more step"
subtitle-code-totp: "<gray>/code <code from your app>"
prompt-code-totp: "<gray>Enter the code from your authenticator app: <yellow>/code <code>"
title-code-email: "<gold>Check your email"
subtitle-code-email: "<gray>A code was sent to <address>"
prompt-code-email: "<gray>Enter the code sent to <yellow><address></yellow>: <yellow>/code <code></yellow>. <gray>No email? <yellow>/code</yellow> sends a new one."
code-sent-login: "<green>A login code was sent to <yellow><address></yellow>."
code-not-needed: "<gray>No code is needed right now."
code-wrong: "<red>Wrong code. <gray>Attempts left for this code: <attempts>"
code-wrong-totp: "<red>Wrong code. <gray>Make sure the time on your phone is correct."
code-missing: "<red>There is no valid code. <gray>Request a new one."
code-cooldown: "<red>Wait <seconds> s before requesting another code."
kick-2fa-unavailable: "<red>Your account needs an email code, but email is unavailable. <gray>Ask an administrator."
security-locked: "<red>Too many wrong passwords or codes. <gray>Try again in <seconds> s."
security-wrong-password: "<red>Wrong password."
click-to-copy: "<gray>Click to copy"
email-unavailable: "<red>Email is not set up on this server."
email-usage: "<gray>Usage: <yellow>/email set <new address> <password></yellow>, <yellow>/email confirm <code></yellow>, <yellow>/email remove <password>"
email-status-none: "<gray>No email is linked. Link one to recover your password: <yellow>/email set <new address> <password>"
email-status: "<gray>Your email: <yellow><address></yellow>. <gray>Change it with <yellow>/email set <new address> <password></yellow> or remove it with <yellow>/email remove <password>"
email-code-sent: "<green>A code was sent to <yellow><address></yellow>. <gray>Confirm with <yellow>/email confirm <code>"
email-linked: "<green>Email <yellow><address></yellow> linked. <gray>You can now recover your password with /recover."
email-removed: "<yellow>Your email was removed."
email-used-by-2fa: "<red>Your email receives your login codes. <gray>Turn that off first: <yellow>/2fa off"
email-send-failed: "<red>The email could not be sent. <gray>Try again later."
2fa-usage: "<gray>Usage: <yellow>/2fa totp</yellow> (authenticator app), <yellow>/2fa email</yellow>, <yellow>/2fa confirm <code></yellow>, <yellow>/2fa off [code]"
2fa-unavailable: "<red>Two-factor authentication is disabled on this server."
2fa-status-off: "<gray>Two-factor authentication is off. Turn it on with <yellow>/2fa totp</yellow> (authenticator app) or <yellow>/2fa email</yellow>."
2fa-status-on: "<gray>Two-factor authentication is on: <yellow><method></yellow>. Turn it off with <yellow>/2fa off"
2fa-method-totp: "authenticator app"
2fa-method-email: "email codes"
2fa-already: "<red>Two-factor authentication is already on. <gray>Turn it off first with /2fa off."
2fa-totp-setup: "<gray>Add this key to an authenticator app (Google Authenticator, Aegis, 2FAS...) as <yellow><issuer></yellow> / <yellow><name></yellow>, choosing \"time based\":"
2fa-totp-confirm: "<gray>Then enter the code the app shows: <yellow>/2fa confirm <code>"
2fa-email-needs-address: "<red>Link an email first: <yellow>/email set <new address> <password>"
2fa-code-sent-enable: "<green>A code was sent to <yellow><address></yellow>. <gray>Confirm with <yellow>/2fa confirm <code>"
2fa-code-sent-disable: "<green>A code was sent to <yellow><address></yellow>. <gray>Confirm with <yellow>/2fa off <code>"
2fa-off-totp: "<gray>Confirm with a code from your app: <yellow>/2fa off <code>"
2fa-enabled: "<green>Two-factor authentication is on. <gray>You will need a code every time you log in."
2fa-disabled: "<yellow>Two-factor authentication is off."
recover-unavailable: "<red>Password recovery is not available on this server."
recover-no-email: "<red>This account has no email to recover the password. <gray>Ask an administrator."
recover-code-sent: "<green>A code was sent to <yellow><address></yellow>. <gray>Set a new password: <yellow>/recover <code> <new password> <new password>"
recover-usage: "<gray>Usage: <yellow>/recover</yellow>, then <yellow>/recover <code> <new password> <new password>"
recover-success: "<green>Your password was changed."
email-subject-confirm-email: "Confirm your email"
email-subject-enable-two-factor: "Turn on two-factor authentication"
email-subject-disable-two-factor: "Turn off two-factor authentication"
email-subject-login: "Your login code"
email-subject-recover: "Password recovery"
email-action-confirm-email: "link this email to your account"
email-action-enable-two-factor: "turn on two-factor authentication"
email-action-disable-two-factor: "turn off two-factor authentication"
email-action-login: "log in"
email-action-recover: "set a new password"
email-text: "Hello, <name>!\n\nYour code to <action>: <code>\nIt is valid for <minutes> minutes.\n\nIf you did not request it, ignore this email and do not share the code with anyone."
