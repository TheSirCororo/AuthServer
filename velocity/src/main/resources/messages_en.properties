# MiniMessage. Placeholders are named in comments.
change-usage=<red>Usage: <yellow>/changepassword <current password> <new password>
change-confirm=<yellow>Change your password?</yellow> <click:run_command:'/changepassword confirm'><green>[Confirm]</green></click> <gray>or type <yellow>/changepassword confirm</yellow> within 30 seconds.
change-nothing-pending=<red>Nothing to confirm. <gray>Use <yellow>/changepassword <current password> <new password>
change-success=<green>Your password was changed.
change-wrong-password=<red>The current password is wrong.
change-not-registered=<red>Your account has no password to change.
change-no-password=<red>Licensed accounts log in through Mojang and have no password.
# <min>
change-too-short=<red>The new password must be at least <min> characters long.
# <max>
change-too-long=<red>The new password must be at most <max> characters long.
change-unsafe=<red>The new password is too easy to guess.
change-same-as-name=<red>The new password must not be your name.
# <seconds>
change-cooldown=<red>Too many wrong passwords. Try again in <seconds> s.
unavailable=<red>The authentication server is unavailable. Try again later.
logout-success=<gray>You logged out. Log in again to continue.
